<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuideMe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

    /* ── Simulate Chrome popup: fixed 380×580px centered ── */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      box-sizing: border-box;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--grad-bg);
      z-index: -1;
    }

    .popup-window {
      width: 380px;
      height: 580px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px var(--border),
        0 24px 64px rgba(0,0,0,0.18),
        0 8px 24px rgba(0,0,0,0.10);
      background: var(--bg);
      position: relative;
    }

    /* ── Header ── */
    .popup-header {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Body ── */
    .popup-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Chat messages ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Bottom bar ── */
    .popup-bottom {
      padding: 10px 14px 14px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Drag handle in header ── */
    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: grab;
      color: var(--border);
      transition: color 0.15s, background 0.15s;
      position: relative;
      user-select: none;
    }
    .drag-handle:hover { color: var(--text-muted); background: var(--bg-subtle); }
    .drag-handle.drag-active {
      cursor: grabbing;
      color: var(--accent);
      background: var(--accent-light);
    }

    /* Drag-mode tooltip */
    .drag-tooltip {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      font-size: 10px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
    }
    .drag-handle:hover .drag-tooltip { opacity: 1; }

    /* When window is being dragged, fix its position */
    .popup-window.dragging {
      position: fixed !important;
      transition: none !important;
      z-index: 50;
    }

    /* ── Input row ── */
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 13px;
      color: var(--text);
    }
    .input-row input::placeholder { color: var(--text-muted); }

    /* ── Icon buttons in header ── */
    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--accent-light); color: var(--accent); }

    /* ── Language dropdown ── */
    .lang-btn {
      position: relative;
    }
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      z-index: 50;
      min-width: 110px;
      display: none;
      animation: fadeIn 0.15s ease-out;
    }
    .lang-dropdown.open { display: block; }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(-4px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      transition: background 0.1s;
      text-align: left;
    }
    .lang-option:hover { background: var(--bg-subtle); }
    .lang-option.active { color: var(--accent); font-weight: 600; }
    .lang-option .lang-check {
      margin-left: auto;
      color: var(--accent);
      display: none;
    }
    .lang-option.active .lang-check { display: block; }

    /* ── Extract / Open Dashboard buttons ── */
    .btn-primary {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: filter 0.2s, box-shadow 0.2s;
    }
    .btn-extract {
      background: var(--grad-primary);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
      margin-bottom: 8px;
    }
    .btn-extract:hover { filter: brightness(1.08); }
    .btn-dashboard {
      background: var(--bg-subtle);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .btn-dashboard:hover { background: var(--accent-light); }

    /* ── Action row icon btn ── */
    .action-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; flex-shrink: 0;
      transition: all 0.15s;
    }
    .action-btn-mic {
      background: transparent;
      color: var(--text-muted);
    }
    .action-btn-mic:hover { background: var(--accent-light); color: var(--accent); }
    .action-btn-mic.recording {
      background: var(--accent);
      color: #fff;
      animation: pulse 1.2s infinite;
    }
    .action-btn-send {
      background: var(--grad-primary);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .action-btn-send:hover { filter: brightness(1.1); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50%       { box-shadow: 0 0 0 6px transparent; }
    }

    /* ── Settings panel (slides in from right) ── */
    .settings-panel {
      position: absolute;
      inset: 0;
      background: var(--bg);
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    .settings-panel.open { transform: translateX(0); }

    .settings-header {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .settings-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .settings-scroll::-webkit-scrollbar { width: 3px; }
    .settings-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .settings-section {
      margin-bottom: 8px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-card);
    }

    /* Section header row — clickable */
    .settings-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      background: var(--bg-card);
      cursor: pointer;
      text-align: left;
    }
    .settings-section-header:hover { background: var(--bg-subtle); }
    .settings-section-label {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .settings-expand-icon {
      color: var(--text-muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .settings-expand-icon.open { transform: rotate(180deg); }

    /* Option rows inside expanded section */
    .settings-section-body {
      background: var(--accent-light);
    }
    .settings-option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      border-top: 1px solid var(--border);
      transition: background 0.1s;
    }
    .settings-option:hover { background: rgba(162,97,244,0.08); }
    .settings-option.active { background: transparent; }
    .settings-option-left {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      font-size: 18px;
      line-height: 1;
      width: 24px;
    }
    .settings-option-label {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .settings-option.active .settings-option-label {
      color: var(--accent);
      font-weight: 600;
    }
    .settings-option-radio { flex-shrink: 0; }

    .settings-row-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: var(--accent-light);
      color: var(--accent);
    }

    /* ── Context menu ── */
    .context-menu {
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.16);
      z-index: 1000;
      min-width: 160px;
      display: none;
    }
    .context-menu.show { display: block; }
    .context-menu-item {
      display: block;
      width: 100%;
      padding: 10px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text);
      transition: background 0.1s;
    }
    .context-menu-item:hover { background: var(--bg-subtle); }
    .context-menu-item.accent { background: var(--accent); color: #fff; }
    .context-menu-item.accent:hover { filter: brightness(1.08); }

    /* ── Slide-in animation ── */
    .slide-in { animation: slideIn 0.25s ease-out; }
    @keyframes slideIn {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Floating "Ask GuideMe" icon ── */
    .ask-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0;
      cursor: pointer;
      z-index: 200;
      animation: fabIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
      user-select: none;
      -webkit-user-select: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      overflow: hidden;
      transition: padding 0.25s ease, gap 0.25s ease;
    }
    .ask-fab:hover {
      padding: 6px 14px 6px 6px;
      gap: 8px;
    }
    .ask-fab:hover .ask-fab-icon { transform: scale(1.04); }
    .ask-fab-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      white-space: nowrap;
      text-align: left;
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-width 0.25s ease, opacity 0.2s ease;
    }
    .ask-fab:hover .ask-fab-label {
      max-width: 100px;
      opacity: 1;
    }
    @keyframes fabIn {
      from { opacity:0; transform:scale(0.6) translateY(16px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .ask-fab-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.20);
      transition: transform 0.15s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ask-fab-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Context menu — triggered by right-click on Ask GuideMe FAB -->
  <div id="ctx-menu" class="context-menu">
    <button class="context-menu-item" onclick="closeFab()">Close</button>
    <button class="context-menu-item accent" onclick="openDashboard()">Open Dashboard</button>
    <button class="context-menu-item" onclick="goToExtension()">Go to Extension</button>
  </div>

  <div id="app"></div>

  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script>
    // ── Theme bootstrap ───────────────────────────────────────
    (function() {
      const s = AppState.get();
      if (s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    // ── Local state ───────────────────────────────────────────
    const appState   = AppState.get();
    let lang         = appState.lang || 'EN';
    let settingsOpen = false;
    let isRecording  = false;
    let inputText    = '';
    let messages     = appState.aiMessages || [];

    // ── Render ────────────────────────────────────────────────
    function render() {
      const state = AppState.get();
      document.getElementById('app').innerHTML = `
        <div class="popup-window slide-in">

          <!-- Header -->
          <div class="popup-header">
            <!-- Logo + name -->
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg overflow-hidden flex-shrink-0">
                <img src="asset/logo.svg" alt="GuideMe" class="w-7 h-7 object-cover">
              </div>
              <span class="font-semibold text-sm" style="color:var(--text)">Guide Me</span>
            </div>

            <!-- Drag handle -->
            <div class="drag-handle flex-1 flex justify-center" id="drag-handle"
                 onmousedown="startWindowDrag(event)" title="Drag to move">
              <svg width="16" height="10" viewBox="0 0 16 10" fill="currentColor">
                <circle cx="3" cy="2" r="1.5"/><circle cx="8" cy="2" r="1.5"/><circle cx="13" cy="2" r="1.5"/>
                <circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/>
              </svg>
              <span class="drag-tooltip">Drag to move</span>
            </div>

            <!-- Right controls -->
            <div class="flex items-center gap-1">
              <!-- Language toggle -->
              <div class="lang-btn" id="lang-btn">
                <button onclick="toggleLangDropdown(event)" class="icon-btn" title="Language">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
                  </svg>
                </button>
                <div class="lang-dropdown" id="lang-dropdown">
                  <button onclick="setLang('EN')" class="lang-option ${lang === 'EN' ? 'active' : ''}">
                    <span>🇬🇧</span> English
                    <svg class="lang-check w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                      <path d="M5 13l4 4L19 7"/>
                    </svg>
                  </button>
                  <button onclick="setLang('KH')" class="lang-option ${lang === 'KH' ? 'active' : ''}">
                    <span>🇰🇭</span> Khmer
                    <svg class="lang-check w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                      <path d="M5 13l4 4L19 7"/>
                    </svg>
                  </button>
                </div>
              </div>
              <!-- Theme -->
              <button onclick="toggleTheme()" class="icon-btn" title="Toggle theme">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  ${state.theme === 'dark'
                    ? `<circle cx="12" cy="12" r="5"/>
                       <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>`
                    : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`
                  }
                </svg>
              </button>
              <!-- Settings -->
              <button onclick="toggleSettings()" class="icon-btn" title="Settings">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Body -->
          <div class="popup-body">

            <!-- Chat messages -->
            <div class="chat-area" id="chat-area">
              ${messages.length === 0 ? renderEmptyState() : messages.map(renderMessage).join('')}
            </div>

            <!-- Bottom bar -->
            <div class="popup-bottom">
              <!-- Action buttons -->
              <button class="btn-primary btn-extract" onclick="extractUI()">
                Extract Separate UI
              </button>
              <button class="btn-primary btn-dashboard" onclick="openDashboard()">
                Open Dashboard
              </button>

              <!-- Input row -->
              <div class="input-row mt-2" id="input-row">
                ${isRecording
                  ? `<span class="text-xs flex-1 font-medium" style="color:var(--accent)">
                       Listening…
                     </span>`
                  : `<input id="chat-input" type="text"
                       placeholder="Type to GuideMe…"
                       value="${escapeHtml(inputText)}"
                       oninput="inputText=this.value; updateActionBtn()"
                       onkeydown="handleEnter(event)">`
                }
                <!-- Mic / Send toggle -->
                ${inputText.trim()
                  ? `<button class="action-btn action-btn-send" onclick="sendMessage()" title="Send">
                       <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                         <g transform="rotate(90,12,12)">
                           <path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                         </g>
                       </svg>
                     </button>`
                  : `<button class="action-btn action-btn-mic ${isRecording ? 'recording' : ''}"
                       onclick="toggleRecording()" title="${isRecording ? 'Stop' : 'Voice input'}">
                       <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                         <rect x="9" y="2" width="6" height="11" rx="3"/>
                         <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>
                       </svg>
                     </button>`
                }
              </div>
            </div>

            <!-- Settings panel (slides in) -->
            <div class="settings-panel ${settingsOpen ? 'open' : ''}" id="settings-panel">
              <div class="settings-header">
                <button onclick="toggleSettings()" class="icon-btn" title="Back">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M19 12H5M12 5l-7 7 7 7"/>
                  </svg>
                </button>
                <span class="font-semibold text-sm" style="color:var(--text)">Settings</span>
              </div>
              <div class="settings-scroll">
                ${renderSettingsPanel()}
              </div>
            </div>

          </div>
        </div>
      `;
      scrollChat();
    }

    // ── Empty state ───────────────────────────────────────────
    function renderEmptyState() {
      return `
        <div class="flex flex-col items-center justify-center h-full text-center py-8">
          <div class="w-12 h-12 rounded-xl overflow-hidden mb-3">
            <img src="asset/logo.svg" alt="GuideMe" class="w-12 h-12 object-cover">
          </div>
          <p class="font-semibold text-sm" style="color:var(--text)">Hi, I'm GuideMe</p>
          <p class="text-xs mt-1" style="color:var(--text-muted)">
            Ask me anything or extract UI to get started
          </p>
        </div>
      `;
    }

    // ── Message bubble ────────────────────────────────────────
    function renderMessage(msg) {
      const isUser = msg.role === 'user';
      return `
        <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
          ${!isUser ? `
            <div class="w-6 h-6 rounded-lg overflow-hidden flex-shrink-0 mr-2 mt-0.5">
              <img src="asset/logo.svg" alt="" class="w-6 h-6 object-cover">
            </div>` : ''}
          <div class="max-w-[75%] px-3 py-2 rounded-2xl text-xs leading-relaxed
            ${isUser
              ? 'text-white rounded-br-sm btn-accent'
              : 'rounded-bl-sm'}"
            style="${!isUser ? 'background:var(--bg-subtle);color:var(--text)' : ''}">
            ${escapeHtml(msg.content)}
            <div class="text-right mt-0.5 opacity-60" style="font-size:9px">${escapeHtml(msg.time || '')}</div>
          </div>
        </div>
      `;
    }

    // ── Settings expanded state ───────────────────────────────
    const settingsExpanded = { Language: true, Theme: false, History: false, 'Speaker Assistant': false, 'Get Help': false };

    function toggleSection(label) {
      settingsExpanded[label] = !settingsExpanded[label];
      const scroll = document.querySelector('.settings-scroll');
      if (scroll) scroll.innerHTML = renderSettingsPanel();
    }

    // ── Settings panel content ────────────────────────────────
    function renderSettingsPanel() {
      const currentTheme = AppState.get().theme;
      const currentSpeaker = AppState.get().speaker || 'Default';

      const LANGS = [
        { code: 'KH', label: 'Khmer',      flag: '🇰🇭' },
        { code: 'EN', label: 'English',     flag: '🇬🇧' },
        { code: 'TH', label: 'Thailand',    flag: '🇹🇭' },
        { code: 'VN', label: 'Vietnam',     flag: '🇻🇳' },
        { code: 'CN', label: 'Chinese',     flag: '🇨🇳' },
      ];
      const THEMES = [
        { key: 'light', label: 'Light', icon: `<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>` },
        { key: 'dark',  label: 'Dark',  icon: `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>` },
      ];
      const SPEAKERS = ['Default','Nova','Echo','Sage','Aria'];

      const sections = [
        {
          id: 'Language',
          icon: `<path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>`,
          rows: LANGS.map(l => ({
            left:   `<span style="font-size:16px;line-height:1">${l.flag}</span>`,
            label:  l.label,
            active: lang === l.code,
            onclick:`setLang('${l.code}')`
          }))
        },
        {
          id: 'Theme',
          icon: currentTheme === 'dark'
            ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`
            : `<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>`,
          rows: THEMES.map(t => ({
            left:   `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${t.icon}</svg>`,
            label:  t.label,
            active: currentTheme === t.key,
            onclick:`setTheme('${t.key}')`
          }))
        },
        {
          id: 'History',
          icon: `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
          rows: (AppState.get().history || []).slice(0,5).map(h => ({
            left:   `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            label:  h.guide,
            active: false,
            onclick:``
          })).concat((AppState.get().history||[]).length === 0
            ? [{ left:'', label:'No history yet', active:false, onclick:'' }] : [])
        },
        {
          id: 'Speaker Assistant',
          icon: `<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>`,
          rows: SPEAKERS.map(s => ({
            left:   `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>`,
            label:  s,
            active: currentSpeaker === s,
            onclick:`setSpeaker('${s}')`
          }))
        },
        {
          id: 'Get Help',
          icon: `<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>`,
          rows: [
            { left: `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.22 1.18 2 2 0 012.18 0h3a2 2 0 012 1.72 12.08 12.08 0 00.65 2.63 2 2 0 01-.45 2.11L6.27 7.91a16 16 0 006.29 6.29l1.45-1.45a2 2 0 012.11-.45 12.08 12.08 0 002.63.65A2 2 0 0122 14.92z"/></svg>`, label: 'Contact Us', active: false, onclick:`alert('Contact Us: support@guideme.app')` },
            { left: `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`, label: 'Survey', active: false, onclick:`alert('Survey: Thank you for your feedback!')` },
          ]
        }
      ];

      return sections.map(s => {
        const isOpen = settingsExpanded[s.id];
        return `
          <div class="settings-section">
            <!-- Section header -->
            <button class="settings-section-header" onclick="toggleSection('${s.id}')">
              <div class="settings-row-icon">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  ${s.icon}
                </svg>
              </div>
              <span class="settings-section-label">${s.id}</span>
              <svg class="settings-expand-icon ${isOpen ? 'open' : ''}" width="14" height="14"
                   fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
            <!-- Section body -->
            ${isOpen ? `
              <div class="settings-section-body">
                ${s.rows.map(r => `
                  <button class="settings-option ${r.active ? 'active' : ''}"
                    ${r.onclick ? `onclick="${r.onclick}"` : ''}>
                    <span class="settings-option-left">${r.left}</span>
                    <span class="settings-option-label">${r.label}</span>
                    <span class="settings-option-radio">
                      ${r.active
                        ? `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                             <circle cx="8" cy="8" r="7" stroke="var(--accent)" stroke-width="1.5"/>
                             <circle cx="8" cy="8" r="4" fill="var(--accent)"/>
                           </svg>`
                        : `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                             <circle cx="8" cy="8" r="7" stroke="var(--border)" stroke-width="1.5"/>
                           </svg>`
                      }
                    </span>
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // ── Actions ───────────────────────────────────────────────
    function toggleLangDropdown(e) {
      e.stopPropagation();
      const dd = document.getElementById('lang-dropdown');
      if (!dd) return;
      const isOpen = dd.classList.contains('open');
      dd.classList.toggle('open', !isOpen);
      if (!isOpen) {
        setTimeout(() => document.addEventListener('click', closeLangDropdown, { once: true }), 10);
      }
    }

    function closeLangDropdown() {
      const dd = document.getElementById('lang-dropdown');
      if (dd) dd.classList.remove('open');
    }

    function setLang(code) {
      lang = code;
      AppState.set('lang', code);
      closeLangDropdown();
      render();
    }

    function toggleSettings() {
      settingsOpen = !settingsOpen;
      const panel = document.getElementById('settings-panel');
      if (panel) panel.classList.toggle('open', settingsOpen);
    }

    function toggleTheme() {
      setTheme(AppState.get().theme === 'dark' ? 'light' : 'dark');
    }

    function setTheme(t) {
      AppState.set('theme', t);
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
      render();
    }

    function setSpeaker(s) {
      AppState.set('speaker', s);
      const scroll = document.querySelector('.settings-scroll');
      if (scroll) scroll.innerHTML = renderSettingsPanel();
    }

    function extractUI() {
      // Open mini-chat as a new window
      window.open('mini-chat.html', 'guideme-mini',
        'width=540,height=100,top=200,left=200,resizable=no,toolbar=no,menubar=no');
      // Hide the popup window
      const win = document.querySelector('.popup-window');
      if (win) {
        win.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
        win.style.opacity = '0';
        win.style.transform = 'scale(0.95)';
        win.style.pointerEvents = 'none';
      }
      // Show floating "Ask GuideMe" icon
      showAskFab();
    }

    function showAskFab() {
      // Remove existing fab if any
      const existing = document.getElementById('ask-fab');
      if (existing) existing.remove();

      const fab = document.createElement('div');
      fab.id = 'ask-fab';
      fab.className = 'ask-fab';
      fab.title = 'Ask GuideMe';
      fab.innerHTML = `
        <div class="ask-fab-icon">
          <img src="asset/logo.svg" alt="GuideMe">
        </div>
        <span class="ask-fab-label">Ask<br>Guide Me</span>
      `;

      document.body.appendChild(fab);

      // ── Drag logic with safe-zone clamping ──────────────────
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      fab.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return; // only left button drag
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = fab.getBoundingClientRect();
        startLeft = rect.left;
        startTop  = rect.top;

        // Switch to absolute positioning based on current position
        fab.style.right  = 'auto';
        fab.style.bottom = 'auto';
        fab.style.left   = startLeft + 'px';
        fab.style.top    = startTop  + 'px';
        fab.style.cursor = 'grabbing';
        fab.style.transition = 'none';

        e.preventDefault();

        function onMouseMove(e) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

          // Clamp within viewport with padding
          const pad    = 8;
          const fabW   = fab.offsetWidth;
          const fabH   = fab.offsetHeight;
          const maxX   = window.innerWidth  - fabW - pad;
          const maxY   = window.innerHeight - fabH - pad;

          const newLeft = Math.min(Math.max(pad, startLeft + dx), maxX);
          const newTop  = Math.min(Math.max(pad, startTop  + dy), maxY);

          fab.style.left = newLeft + 'px';
          fab.style.top  = newTop  + 'px';
        }

        function onMouseUp() {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup',   onMouseUp);
          fab.style.cursor     = 'pointer';
          fab.style.transition = '';
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup',   onMouseUp);
      });

      // Left click (not drag) → reopen mini-chat
      fab.addEventListener('click', (e) => {
        if (isDragging) { isDragging = false; return; }
        e.stopPropagation();
        window.open('mini-chat.html', 'guideme-mini',
          'width=540,height=100,top=200,left=200,resizable=no,toolbar=no,menubar=no');
      });

      // Right click → context menu
      fab.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showContextMenu(e);
      });
    }

    function openDashboard() {
      closeContextMenu();
      window.open(
        'dashboard.html',
        'guideme-dashboard',
        'width=1100,height=720,top=60,left=60,resizable=yes,toolbar=no,menubar=no,scrollbars=no'
      );
    }

    function closeFab() {
      closeContextMenu();
      const fab = document.getElementById('ask-fab');
      if (fab) fab.remove();
    }

    function goToExtension() {
      closeContextMenu();
      // Bring the popup back into view
      const win = document.querySelector('.popup-window');
      if (win) {
        win.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
        win.style.opacity = '1';
        win.style.transform = 'scale(1)';
        win.style.pointerEvents = '';
      }
      // Remove the FAB since popup is visible again
      const fab = document.getElementById('ask-fab');
      if (fab) fab.remove();
    }

    // ── Voice recording (simulated) ───────────────────────────
    let recordingTimer = null;
    const VOICE_SAMPLES = [
      'How do I create a guide?',
      'What is GuideMe?',
      'Show me my recent guides',
      'Help me understand this page',
    ];

    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      isRecording = true;
      render();
      // Simulate transcription after 2s
      recordingTimer = setTimeout(() => {
        const sample = VOICE_SAMPLES[Math.floor(Math.random() * VOICE_SAMPLES.length)];
        isRecording = false;
        inputText = sample;
        render();
        // Focus input
        setTimeout(() => {
          const el = document.getElementById('chat-input');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }, 50);
      }, 2000);
    }

    function stopRecording() {
      clearTimeout(recordingTimer);
      isRecording = false;
      render();
    }

    // ── Chat ──────────────────────────────────────────────────
    function updateActionBtn() {
      const row = document.getElementById('input-row');
      if (!row) return;
      const hasTxt = inputText.trim().length > 0;
      const existing = row.querySelector('.action-btn');
      if (hasTxt && existing && existing.classList.contains('action-btn-mic')) {
        existing.outerHTML = `
          <button class="action-btn action-btn-send" onclick="sendMessage()" title="Send">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <g transform="rotate(90,12,12)">
                <path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
              </g>
            </svg>
          </button>`;
      } else if (!hasTxt && existing && existing.classList.contains('action-btn-send')) {
        existing.outerHTML = `
          <button class="action-btn action-btn-mic" onclick="toggleRecording()" title="Voice input">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <rect x="9" y="2" width="6" height="11" rx="3"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>
            </svg>
          </button>`;
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      const inputEl = document.getElementById('chat-input');
      const text = (inputEl ? inputEl.value : inputText).trim();
      if (!text) return;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      messages.push({ role: 'user', content: text, time: now });
      AppState.set('aiMessages', messages);
      inputText = '';
      render();
      setTimeout(() => {
        const replies = [
          "I can help you with that! Would you like me to analyze the current page and suggest guide steps?",
          "Great question! Let me break that down for you.",
          "I've found relevant information. Here's what I can do to help...",
          "You can create a guide by clicking 'Extract Separate UI', then I'll guide you through it.",
        ];
        const replyTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        messages.push({
          role: 'assistant',
          content: replies[Math.floor(Math.random() * replies.length)],
          time: replyTime
        });
        AppState.set('aiMessages', messages);
        render();
      }, 800);
    }

    function scrollChat() {
      setTimeout(() => {
        const el = document.getElementById('chat-area');
        if (el) el.scrollTop = el.scrollHeight;
      }, 50);
    }

    // ── Context menu ──────────────────────────────────────────
    function showContextMenu(e) {
      e.preventDefault();
      const menu = document.getElementById('ctx-menu');
      if (!menu) return;
      menu.classList.add('show');

      menu.style.left = '-9999px';
      menu.style.top  = '-9999px';

      requestAnimationFrame(() => {
        const mw  = menu.offsetWidth;
        const mh  = menu.offsetHeight;
        const pad = 8;
        const vw  = window.innerWidth;
        const vh  = window.innerHeight;

        let x = e.clientX;
        let y = e.clientY;

        if (x + mw + pad > vw) x = x - mw;
        if (y + mh + pad > vh) y = y - mh;

        x = Math.max(pad, Math.min(x, vw - mw - pad));
        y = Math.max(pad, Math.min(y, vh - mh - pad));

        menu.style.left = x + 'px';
        menu.style.top  = y + 'px';
      });

      setTimeout(() => document.addEventListener('click', closeContextMenu, { once: true }), 10);
    }

    function closeContextMenu() {
      const menu = document.getElementById('ctx-menu');
      if (menu) menu.classList.remove('show');
    }

    // ── Util ──────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Window drag (drag handle in header) ───────────────────
    function startWindowDrag(e) {
      if (e.button !== 0) return;
      const win = document.querySelector('.popup-window');
      const handle = document.getElementById('drag-handle');
      if (!win) return;

      const rect = win.getBoundingClientRect();
      win.style.position   = 'fixed';
      win.style.left       = rect.left + 'px';
      win.style.top        = rect.top  + 'px';
      win.style.margin     = '0';
      win.style.transition = 'none';
      win.classList.add('dragging');
      if (handle) handle.classList.add('drag-active');

      const startX    = e.clientX;
      const startY    = e.clientY;
      const startLeft = rect.left;
      const startTop  = rect.top;

      e.preventDefault();

      function onMouseMove(e) {
        const pad  = 8;
        const maxX = window.innerWidth  - win.offsetWidth  - pad;
        const maxY = window.innerHeight - win.offsetHeight - pad;
        const newL = Math.min(Math.max(pad, startLeft + e.clientX - startX), maxX);
        const newT = Math.min(Math.max(pad, startTop  + e.clientY - startY), maxY);
        win.style.left = newL + 'px';
        win.style.top  = newT + 'px';
      }

      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup',   onMouseUp);
        if (handle) handle.classList.remove('drag-active');
      }

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup',   onMouseUp);
    }

    // ── Initial Render ────────────────────────────────────────
    render();
  </script>
</body>
</html>
